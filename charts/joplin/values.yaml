joplin-server:
  #
  # IMPORTANT NOTE
  #
  # This chart inherits from our common library chart. You can check the default values/options here:
  # https://github.com/k8s-at-home/library-charts/tree/main/charts/stable/common/values.yaml
  #

  image:
    # -- image repository
    repository: joplin/server
      # -- image tag
    tag: 2.7.4-beta
    # -- image pull policy
    pullPolicy: IfNotPresent

  # -- environment variables. See [image docs](https://github.com/laurent22/joplin) for more details.
  # @default -- See below
  env:
    # -- Set the container timezone
    TZ: UTC
    # -- joplin-server base URL
    APP_BASE_URL: https://notes.homeapps.io
    # -- joplin-server listening port (same as Service port)
    APP_PORT: 22300
    # -- Use pg for postgres
    DB_CLIENT: pg
    # -- Postgres DB Host
    POSTGRES_HOST: postgres-postgresql.postgres
    # -- Postgres DB port
    POSTGRES_PORT:  # 5432
    # -- Postgres DB name
    POSTGRES_DATABASE: joplin
    # -- Postgres DB Username
    POSTGRES_USER: postgres
    # -- Postgres DB password
    POSTGRES_PASSWORD:  LpFot16Ymv

    MAX_TIME_DRIFT: 0

  # -- Configures service settings for the chart.
  # @default -- See values.yaml
  service:
    main:
      ports:
        http:
          port: 22300


  ingress:
    main:
      # -- Enables or disables the ingress
      enabled: true

      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
      ingressClassName: nginx

      hosts:
        -  # -- Host address. Helm template can be passed.
          host: notes.homeapps.io
          ## Configure the paths for the host
          paths:
            -  # -- Path.  Helm template can be passed.
              path: /
              # -- Ignored if not kubeVersion >= 1.14-0
              pathType: Prefix
      tls:
      - secretName: notes-homeapps-tls
        hosts:
          - notes.homeapps.io
  # -- Enable and configure postgresql database subchart under this key.
  #    For more options see [postgresql chart documentation](https://github.com/bitnami/charts/tree/master/bitnami/postgresql)
  # @default -- See values.yaml
  postgresql:
    enabled: false
    postgresqlUsername: joplin
    postgresqlPassword: joplin-pass
    postgresqlDatabase: joplin
    persistence:
      enabled: false
      # storageClass: ""

