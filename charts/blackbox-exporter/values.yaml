prometheus-blackbox-exporter:
  config:
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: []
          no_follow_redirects: false
          preferred_ip_protocol: ip4

      icmp:
        prober: icmp
        timeout: 5s
        icmp:
          preferred_ip_protocol: ip4

      tcp_connect:
        prober: tcp
        timeout: 5s

  securityContext:
    capabilities:
      add:
        - NET_RAW

  serviceMonitor:
    enabled: false
