{{- $secretName := .Values.postgres.existingSecret -}}
{{- $secretKey := .Values.postgres.secretKey -}}
{{- $existing := lookup "v1" "Secret" .Values.namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "mattermost.name" . }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- if and $existing (hasKey $existing.data $secretKey) }}
  {{ $secretKey }}: {{ index $existing.data $secretKey }}
  {{- else }}
  {{ $secretKey }}: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
