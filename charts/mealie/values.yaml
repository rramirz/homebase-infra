replicaCount: 1

image:
  repository: ghcr.io/mealie-recipes/mealie
  tag: "v3.20.1"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

namespace: mealie

service:
  type: ClusterIP
  port: 80
  containerPort: 9000

persistence:
  size: 10Gi
  storageClass: ssd

httpRoute:
  enabled: true
  annotations: {}
  hostnames:
    - mealie.theramirez.casa
  parentRefs:
    - name: home
      namespace: kgateway-system
      sectionName: https
  timeouts:
    request: 300s
    backendRequest: 300s

env:
  TZ: America/New_York
  BASE_URL: https://mealie.theramirez.casa
  ALLOW_SIGNUP: "false"
  DEFAULT_EMAIL: changeme@example.com
  DEFAULT_GROUP: Home
  DEFAULT_HOUSEHOLD: Home

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

podSecurityContext:
  fsGroup: 1000

securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}
