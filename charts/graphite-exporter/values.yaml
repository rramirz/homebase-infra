replicaCount: 1

image:
  repository: prom/graphite-exporter
  pullPolicy: IfNotPresent
  tag: "v0.15.1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  metricsPort: 9108
  graphitePort: 2003

args:
  # - "--graphite.mapping-config=/etc/graphite-exporter/graphite-mapping.conf"
  - "--graphite.listen-address=:$(GRAPHITE_PORT)"
  - "--web.listen-address=:$(METRICS_PORT)"

config:
  enabled: true
  files:
    graphite-mapping.conf: |
      mappings:
      - match: '(.+)'
        name: 'nas_${1}'
        labels:
          source: 'nas'

env:
  - name: GRAPHITE_PORT
    value: "2003"
  - name: METRICS_PORT
    value: "9108"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-cloudflare"
  hosts:
    - host: graphite.theramirez.casa
      paths:
        - path: /
          pathType: Prefix
  tls:
   - secretName: graphite-tls
     hosts:
       - graphite.theramirez.casa

resources: {}

livenessProbe:
  httpGet:
    path: /metrics
    port: metrics
readinessProbe:
  httpGet:
    path: /metrics
    port: metrics

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
