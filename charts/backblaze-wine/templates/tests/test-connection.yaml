apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "backblaze-wine.fullname" . }}-test-connection"
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "backblaze-wine.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.8.0
      command: ['curl']
      args: ['-fkI', 'https://{{ include "backblaze-wine.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
