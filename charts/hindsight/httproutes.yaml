# Not managed by the Helm chart; apply with kubectl.
# Both routes need timeouts.request on the API rule: kgateway's default is 15s and recall can exceed it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hindsight
  namespace: hindsight
spec:
  hostnames:
    - hindsight.theramirez.casa
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: home
      namespace: kgateway-system
      sectionName: https
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1}
        - path: {type: PathPrefix, value: /mcp}
      backendRefs:
        - name: hindsight-api
          port: 8888
      timeouts:
        request: 120s
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: hindsight-control-plane
          port: 3000
---
# Per-org alias hosts; same backend and banks as hindsight.theramirez.casa.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hindsight-aliases
  namespace: hindsight
spec:
  hostnames:
    - lb-mem.theramirez.casa
    - arrive-mem.theramirez.casa
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: home
      namespace: kgateway-system
      sectionName: https
  rules:
    - matches:
        - path: {type: PathPrefix, value: /v1}
        - path: {type: PathPrefix, value: /mcp}
      backendRefs:
        - name: hindsight-api
          port: 8888
      timeouts:
        request: 120s
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: hindsight-control-plane
          port: 3000
