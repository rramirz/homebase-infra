app-template:
  controllers:
    main:
      strategy: Recreate
      initContainers:
        settings-guard:
          image:
            repository: ghcr.io/seerr-team/seerr
            tag: v3.4.1
            pullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Restore newest valid auto-backup if settings.json is missing/empty/uninitialized.
              F=/app/config/settings.json; D=/app/config/backups/auto
              if [ -s "$F" ] && grep -q '"initialized": true' "$F" && ! grep -q '"mediaServerType": 4' "$F"; then
                echo "settings.json OK"; exit 0
              fi
              for B in $(ls -1t $D/settings-*.json 2>/dev/null); do
                if grep -q '"initialized": true' "$B" && ! grep -q '"mediaServerType": 4' "$B"; then
                  cp "$F" "$D/bad-$(date +%s).json" 2>/dev/null
                  cp "$B" "$F" && echo "RESTORED $F from $B" && exit 0
                fi
              done
              echo "no valid backup found; leaving as is"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
      containers:
        settings-backup:
          image:
            repository: ghcr.io/seerr-team/seerr
            tag: v3.4.1
            pullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              F=/app/config/settings.json; D=/app/config/backups/auto; mkdir -p $D
              while true; do
                sleep 3600
                if [ -s "$F" ] && grep -q '"initialized": true' "$F" && ! grep -q '"mediaServerType": 4' "$F"; then
                  cp "$F" "$D/settings-$(date +%Y%m%d-%H%M%S).json"
                  ls -1t $D/settings-*.json | tail -n +25 | xargs -r rm -f
                fi
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
        main:
          image:
            repository: ghcr.io/seerr-team/seerr
            tag: v3.4.1
            pullPolicy: IfNotPresent
          env:
            TZ: America/New_York
            PORT: "5055"
            LOG_LEVEL: info
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v1/status
                  port: 5055
                initialDelaySeconds: 30
                periodSeconds: 30
                failureThreshold: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/v1/status
                  port: 5055
                initialDelaySeconds: 30
                periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi

  service:
    main:
      controller: main
      ports:
        http:
          port: 5055

  route:
    main:
      enabled: true
      kind: HTTPRoute
      hostnames:
        - request.theramirez.casa
      parentRefs:
        - name: home
          namespace: kgateway-system
          sectionName: https
      rules:
        - backendRefs:
            - identifier: main
              port: http
          matches:
            - path:
                type: PathPrefix
                value: /

  persistence:
    config:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 5Gi
      retain: true
      globalMounts:
        - path: /app/config
