apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
  name: sleep-pod-deployment
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: sleep-pod
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2024-03-16T23:32:08-04:00"
      creationTimestamp: null
      labels:
        app: sleep-pod
    spec:
      containers:
      - command:
        - /bin/sleep
        - infinity
        image: ubuntu
        imagePullPolicy: Always
        name: sleep-container
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /nvme
          name: sleep-volume1
        - mountPath: /ssd
          name: sleep-volume2
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: sleep-volume1
        persistentVolumeClaim:
          claimName: nvme-pvc
      - name: sleep-volume2
        persistentVolumeClaim:
          claimName: ssd-pvc
