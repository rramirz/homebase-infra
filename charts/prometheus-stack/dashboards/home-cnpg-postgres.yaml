---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-home-cnpg-postgres
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: prometheus-stack
  annotations:
    grafana_folder: Databases
data:
  home-cnpg-postgres.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "tags": ["postgres", "cnpg", "home-db"],
      "timezone": "browser",
      "title": "Home DB / CloudNativePG Postgres",
      "uid": "home-cnpg-postgres",
      "time": {"from": "now-6h", "to": "now"},
      "refresh": "30s",
      "templating": {
        "list": [
          {"name": "datasource", "type": "datasource", "query": "prometheus", "current": {"text": "Prometheus", "value": "prometheus"}},
          {"name": "cluster", "type": "query", "datasource": {"type": "prometheus", "uid": "${datasource}"}, "query": "label_values(cnpg_collector_up, cluster)", "refresh": 1, "current": {"text": "home-db", "value": "home-db"}},
          {"name": "database", "type": "query", "datasource": {"type": "prometheus", "uid": "${datasource}"}, "query": "label_values(cnpg_backends_total, datname)", "includeAll": true, "multi": true, "refresh": 1, "current": {"text": "All", "value": "$__all"}}
        ]
      },
      "panels": [
        {"id": 1, "type": "stat", "title": "Postgres up", "gridPos": {"x": 0, "y": 0, "w": 4, "h": 4}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "targets": [{"expr": "max(cnpg_collector_up{cluster=\"$cluster\"})", "refId": "A"}], "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}], "thresholds": {"mode": "absolute", "steps": [{"color": "red"}, {"color": "green", "value": 1}]}}}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "textMode": "value"}},
        {"id": 2, "type": "stat", "title": "Postgres version", "gridPos": {"x": 4, "y": 0, "w": 4, "h": 4}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "targets": [{"expr": "max(cnpg_collector_postgres_version{cluster=\"$cluster\"})", "refId": "A"}], "fieldConfig": {"defaults": {"decimals": 1}}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "textMode": "value"}},
        {"id": 3, "type": "stat", "title": "Active connections", "gridPos": {"x": 8, "y": 0, "w": 4, "h": 4}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "targets": [{"expr": "sum(cnpg_backends_total{datname=~\"$database\"})", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short"}}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "textMode": "value"}},
        {"id": 4, "type": "stat", "title": "Waiting queries", "gridPos": {"x": 12, "y": 0, "w": 4, "h": 4}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "targets": [{"expr": "max(cnpg_backends_waiting_total)", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "orange", "value": 1}, {"color": "red", "value": 5}]}}}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "textMode": "value"}},
        {"id": 5, "type": "stat", "title": "WAL size", "gridPos": {"x": 16, "y": 0, "w": 4, "h": 4}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "targets": [{"expr": "max(cnpg_collector_pg_wal{value=\"size\"})", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "bytes"}}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "textMode": "value"}},
        {"id": 6, "type": "stat", "title": "Collection errors", "gridPos": {"x": 20, "y": 0, "w": 4, "h": 4}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "targets": [{"expr": "max(cnpg_collector_last_collection_error)", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 1}]}}}, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "textMode": "value"}},
        {"id": 7, "type": "timeseries", "title": "Connections by database/state", "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "targets": [{"expr": "sum by (datname, state) (cnpg_backends_total{datname=~\"$database\"})", "legendFormat": "{{datname}} {{state}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short"}}},
        {"id": 8, "type": "timeseries", "title": "Longest transaction", "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "targets": [{"expr": "max by (datname, usename) (cnpg_backends_max_tx_duration_seconds{datname=~\"$database\"})", "legendFormat": "{{datname}}/{{usename}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "s"}}},
        {"id": 9, "type": "timeseries", "title": "WAL generation", "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "targets": [{"expr": "rate(cnpg_collector_wal_bytes[5m])", "legendFormat": "WAL bytes/sec", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "Bps"}}},
        {"id": 10, "type": "timeseries", "title": "WAL files", "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "targets": [{"expr": "cnpg_collector_pg_wal", "legendFormat": "{{value}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short"}}},
        {"id": 11, "type": "timeseries", "title": "Logical replication lag", "gridPos": {"x": 0, "y": 20, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "targets": [{"expr": "cnpg_pg_replication_slots_slot_retained_wal", "legendFormat": "{{slot_name}}", "refId": "A"}], "fieldConfig": {"defaults": {"unit": "bytes"}}},
        {"id": 12, "type": "table", "title": "Database connections", "gridPos": {"x": 12, "y": 20, "w": 12, "h": 8}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "targets": [{"expr": "sum by (datname, usename, state) (cnpg_backends_total{datname=~\"$database\"})", "format": "table", "instant": true, "refId": "A"}], "fieldConfig": {"defaults": {"unit": "short"}}}
      ]
    }
