---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-internet-uptime
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: prometheus-stack
  annotations:
    grafana_folder: Homelab
data:
  internet-uptime.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "tags": ["homelab", "network", "internet", "uptime"],
      "timezone": "browser",
      "title": "Internet Uptime",
      "uid": "internet-uptime-homelab",
      "time": {"from": "now-24h", "to": "now"},
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Internet Status",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}
              ],
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}
            }
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "min(probe_success{job=\"blackbox-http\"})",
              "legendFormat": "Internet"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Router (OPNsense)",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}
              ],
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}
            }
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "probe_success{job=\"blackbox-icmp\", instance=\"192.168.1.1\"}",
              "legendFormat": "Router"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Probe Latency (1.1.1.1)",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "auto",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.1}, {"color": "red", "value": 0.5}]}
            }
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "probe_duration_seconds{job=\"blackbox-http\", instance=\"https://1.1.1.1\"}",
              "legendFormat": "1.1.1.1"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Uptime (24h)",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 0.95}, {"color": "green", "value": 0.99}]}
            }
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "avg_over_time(min(probe_success{job=\"blackbox-http\"})[24h:30s])",
              "legendFormat": "24h uptime"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Internet Probe Success (all targets)",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 4},
          "options": {
            "tooltip": {"mode": "multi"},
            "legend": {"displayMode": "list", "placement": "bottom"}
          },
          "fieldConfig": {
            "defaults": {
              "custom": {"lineWidth": 2, "fillOpacity": 10},
              "mappings": [
                {"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}
              ],
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]},
              "min": 0, "max": 1
            }
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "probe_success{job=\"blackbox-http\"}",
              "legendFormat": "{{instance}}"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "probe_success{job=\"blackbox-icmp\"}",
              "legendFormat": "router ({{instance}})"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Probe Latency",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 12},
          "options": {
            "tooltip": {"mode": "multi"},
            "legend": {"displayMode": "list", "placement": "bottom"}
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {"lineWidth": 2, "fillOpacity": 5},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.5}, {"color": "red", "value": 2}]}
            }
          },
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "probe_duration_seconds{job=\"blackbox-http\"}",
              "legendFormat": "{{instance}}"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "probe_duration_seconds{job=\"blackbox-icmp\"}",
              "legendFormat": "router ({{instance}})"
            }
          ]
        }
      ]
    }
