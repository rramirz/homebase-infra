---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-backblaze-personal
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: prometheus-stack
  annotations:
    grafana_folder: Homelab
data:
  backblaze-personal.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "tags": [
        "homelab",
        "backup",
        "backblaze",
        "network"
      ],
      "timezone": "browser",
      "title": "Homelab / Backblaze Personal",
      "uid": "homelab-backblaze-personal",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Exporter up",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "up{job=\"backblaze-personal\"}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red"
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "textMode": "value"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Service running",
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "backblaze_service_active{job=\"backblaze-personal\"} * backblaze_container_running{job=\"backblaze-personal\"}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "STOPPED",
                      "color": "red"
                    },
                    "1": {
                      "text": "RUNNING",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red"
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "textMode": "value"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "rramirez (D:) fixed + selected",
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "backblaze_d_drive_fixed{job=\"backblaze-personal\"} * backblaze_d_drive_selected{job=\"backblaze-personal\"}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "BAD",
                      "color": "red"
                    },
                    "1": {
                      "text": "OK",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red"
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "textMode": "value"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Z: selected (should be 0)",
          "gridPos": {
            "x": 8,
            "y": 3,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "backblaze_z_drive_selected{job=\"backblaze-personal\"}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "OK",
                      "color": "green"
                    },
                    "1": {
                      "text": "WARN",
                      "color": "orange"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "textMode": "value"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Remaining bytes",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "backblaze_remaining_bytes{job=\"backblaze-personal\"}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "textMode": "value"
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Last backup age",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "backblaze_last_backup_age_seconds{job=\"backblaze-personal\"}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "yellow",
                    "value": 86400
                  },
                  {
                    "color": "red",
                    "value": 129600
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "textMode": "value"
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "rramirez (D:) selected files",
          "gridPos": {
            "x": 12,
            "y": 3,
            "w": 6,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "backblaze_d_drive_selected_files{job=\"backblaze-personal\"}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red"
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "textMode": "value"
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Upload speed (eth0)",
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "rate(node_network_transmit_bytes_total{job=\"backblaze-node\",device=\"eth0\"}[5m]) * 8",
              "legendFormat": "upload bps",
              "refId": "A"
            },
            {
              "expr": "rate(node_network_receive_bytes_total{job=\"backblaze-node\",device=\"eth0\"}[5m]) * 8",
              "legendFormat": "download bps",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bps",
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Backup remaining over time",
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "backblaze_remaining_bytes{job=\"backblaze-personal\"}",
              "legendFormat": "remaining bytes",
              "refId": "A"
            },
            {
              "expr": "backblaze_volume_remaining_bytes{job=\"backblaze-personal\",mount=\"D:\\\\\"}",
              "legendFormat": "rramirez (D:) remaining bytes",
              "refId": "B"
            },
            {
              "expr": "backblaze_volume_remaining_bytes{job=\"backblaze-personal\",mount=\"E:\\\\\"}",
              "legendFormat": "home-share (E:) remaining bytes",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Remaining files over time",
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "backblaze_remaining_files{job=\"backblaze-personal\"}",
              "legendFormat": "remaining files",
              "refId": "A"
            },
            {
              "expr": "backblaze_volume_remaining_files{job=\"backblaze-personal\",mount=\"D:\\\\\"}",
              "legendFormat": "rramirez (D:) remaining files",
              "refId": "B"
            },
            {
              "expr": "backblaze_volume_remaining_files{job=\"backblaze-personal\",mount=\"E:\\\\\"}",
              "legendFormat": "home-share (E:) remaining files",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Total uploaded (24h)",
          "gridPos": {
            "x": 12,
            "y": 14,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "increase(node_network_transmit_bytes_total{job=\"backblaze-node\",device=\"eth0\"}[1h])",
              "legendFormat": "uploaded last 1h",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "fillOpacity": 15,
                "lineWidth": 2
              }
            }
          }
        },
        {
          "id": 12,
          "type": "table",
          "title": "Per-volume backup status",
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 24,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "backblaze_volume_selected_files{job=\"backblaze-personal\"}",
              "refId": "A",
              "instant": true,
              "format": "table",
              "legendFormat": "selected files"
            },
            {
              "expr": "backblaze_volume_remaining_files{job=\"backblaze-personal\"}",
              "refId": "B",
              "instant": true,
              "format": "table",
              "legendFormat": "remaining files"
            },
            {
              "expr": "backblaze_volume_remaining_bytes{job=\"backblaze-personal\"}",
              "refId": "C",
              "instant": true,
              "format": "table",
              "legendFormat": "remaining bytes"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "host": true,
                  "service": true
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "mount"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "D:\\": {
                            "text": "rramirez (D:\\)"
                          },
                          "E:\\": {
                            "text": "home-share (E:\\)"
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 13,
          "type": "stat",
          "title": "home-share (E:) included",
          "gridPos": {
            "x": 4,
            "y": 3,
            "w": 4,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "backblaze_volume_included{job=\"backblaze-personal\",mount=\"E:\\\\\"}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "BAD",
                      "color": "red"
                    },
                    "1": {
                      "text": "OK",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red"
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "textMode": "value"
          }
        },
        {
          "id": 14,
          "type": "stat",
          "title": "home-share (E:) selected files",
          "gridPos": {
            "x": 18,
            "y": 3,
            "w": 6,
            "h": 3
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "backblaze_volume_selected_files{job=\"backblaze-personal\",mount=\"E:\\\\\"}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red"
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "textMode": "value"
          }
        }
      ]
    }
