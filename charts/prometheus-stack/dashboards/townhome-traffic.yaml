---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-townhome-traffic
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: prometheus-stack
  annotations:
    grafana_folder: Homelab
data:
  townhome-traffic.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "tags": [
        "homelab",
        "townhome",
        "cloudflare-tunnel"
      ],
      "timezone": "utc",
      "title": "Townhome Listing / Traffic",
      "uid": "townhome-traffic",
      "time": {
        "from": "now-3d",
        "to": "now"
      },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 101,
          "type": "stat",
          "title": "Site health",
          "description": "checks the public production URL through the tunnel.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "probe_success{job=\"blackbox-townhome\", instance=\"https://townhome.theramirez.casa\"}",
              "legendFormat": "health",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "HEALTHY",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red"
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "textMode": "auto"
          }
        },
        {
          "id": 102,
          "type": "stat",
          "title": "Visitors today (UTC)",
          "description": "distinct client IPs, approximate people, bots/shared networks can affect it.",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "max(townhome_unique_visitors_today{host=\"townhome.theramirez.casa\"}) or vector(0)",
              "legendFormat": "today",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "textMode": "value"
          }
        },
        {
          "id": 103,
          "type": "stat",
          "title": "Visitors yesterday (UTC)",
          "description": "distinct client IPs, approximate people, bots/shared networks can affect it.",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "max(townhome_unique_visitors_yesterday{host=\"townhome.theramirez.casa\"}) or vector(0)",
              "legendFormat": "yesterday",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "textMode": "value"
          }
        },
        {
          "id": 104,
          "type": "timeseries",
          "title": "Finalized daily visitors (UTC)",
          "description": "one bar per retained daily sample; values are finalized prior-UTC-day distinct IP counts reported one day later; same person can count on multiple days; do not sum bars as monthly unique people; only available Prometheus retention is shown (currently 3 days).",
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "max(townhome_unique_visitors_yesterday{host=\"townhome.theramirez.casa\"})",
              "legendFormat": "visitors",
              "refId": "A",
              "interval": "1d"
            }
          ],
          "options": {
            "legend": {
              "showLegend": false,
              "displayMode": "hidden"
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "barAlignment": 0,
                "lineWidth": 0,
                "gradientMode": "none"
              },
              "unit": "short",
              "min": 0
            }
          },
          "interval": "1d"
        },
        {
          "id": 105,
          "type": "state-timeline",
          "title": "Site health over time",
          "description": "red periods mean the public production URL failed its external probe.",
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 24,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "probe_success{job=\"blackbox-townhome\", instance=\"https://townhome.theramirez.casa\"}",
              "legendFormat": "health",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "HEALTHY",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red"
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 200,
          "type": "row",
          "title": "Diagnostics",
          "collapsed": true,
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 24,
            "h": 1
          },
          "panels": [
            {
              "id": 1,
              "type": "stat",
              "title": "Tunnel edge status",
              "gridPos": {
                "x": 0,
                "y": 0,
                "w": 6,
                "h": 4
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "targets": [
                {
                  "expr": "probe_success{job=\"blackbox-townhome\", instance=\"https://townhome.theramirez.casa\"}",
                  "legendFormat": "prod",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "mappings": [
                    {
                      "type": "value",
                      "options": {
                        "0": {
                          "text": "DOWN",
                          "color": "red"
                        },
                        "1": {
                          "text": "UP",
                          "color": "green"
                        }
                      }
                    }
                  ],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "red"
                      },
                      {
                        "color": "green",
                        "value": 1
                      }
                    ]
                  }
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ]
                },
                "colorMode": "background",
                "textMode": "auto"
              }
            },
            {
              "id": 2,
              "type": "stat",
              "title": "Tunnel HTTP status",
              "gridPos": {
                "x": 6,
                "y": 0,
                "w": 6,
                "h": 4
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "targets": [
                {
                  "expr": "probe_http_status_code{job=\"blackbox-townhome\", instance=\"https://townhome.theramirez.casa\"}",
                  "legendFormat": "prod",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "red"
                      },
                      {
                        "color": "green",
                        "value": 200
                      },
                      {
                        "color": "yellow",
                        "value": 300
                      },
                      {
                        "color": "red",
                        "value": 400
                      }
                    ]
                  }
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ]
                },
                "colorMode": "background",
                "textMode": "value"
              }
            },
            {
              "id": 3,
              "type": "stat",
              "title": "Tunnel latency",
              "gridPos": {
                "x": 12,
                "y": 0,
                "w": 6,
                "h": 4
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "targets": [
                {
                  "expr": "probe_duration_seconds{job=\"blackbox-townhome\", instance=\"https://townhome.theramirez.casa\"}",
                  "legendFormat": "prod",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green"
                      },
                      {
                        "color": "yellow",
                        "value": 1
                      },
                      {
                        "color": "red",
                        "value": 3
                      }
                    ]
                  }
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ]
                },
                "colorMode": "value",
                "textMode": "value"
              }
            },
            {
              "id": 4,
              "type": "stat",
              "title": "TLS cert days left",
              "gridPos": {
                "x": 18,
                "y": 0,
                "w": 6,
                "h": 4
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "targets": [
                {
                  "expr": "(probe_ssl_earliest_cert_expiry{job=\"blackbox-townhome\", instance=\"https://townhome.theramirez.casa\"} - time()) / 86400",
                  "legendFormat": "prod",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "d",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "red"
                      },
                      {
                        "color": "yellow",
                        "value": 14
                      },
                      {
                        "color": "green",
                        "value": 30
                      }
                    ]
                  }
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ]
                },
                "colorMode": "background",
                "textMode": "value"
              }
            },
            {
              "id": 5,
              "type": "timeseries",
              "title": "Edge probe success",
              "gridPos": {
                "x": 0,
                "y": 4,
                "w": 12,
                "h": 7
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "targets": [
                {
                  "expr": "probe_success{job=\"blackbox-townhome\"}",
                  "legendFormat": "{{host}}",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "min": 0,
                  "max": 1,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "red"
                      },
                      {
                        "color": "green",
                        "value": 1
                      }
                    ]
                  }
                }
              }
            },
            {
              "id": 6,
              "type": "timeseries",
              "title": "Edge probe latency",
              "gridPos": {
                "x": 12,
                "y": 4,
                "w": 12,
                "h": 7
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s"
                }
              },
              "targets": [
                {
                  "expr": "probe_duration_seconds{job=\"blackbox-townhome\"}",
                  "legendFormat": "{{host}}",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 7,
              "type": "timeseries",
              "title": "Origin requests / sec by host",
              "gridPos": {
                "x": 0,
                "y": 11,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "targets": [
                {
                  "expr": "sum by (host) (rate(townhome_http_response_count_total{host=~\"townhome.*\"}[$__rate_interval]))",
                  "legendFormat": "{{host}}",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 8,
              "type": "timeseries",
              "title": "Origin requests / sec by status (prod)",
              "gridPos": {
                "x": 12,
                "y": 11,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "targets": [
                {
                  "expr": "sum by (status) (rate(townhome_http_response_count_total{host=\"townhome.theramirez.casa\"}[5m]))",
                  "legendFormat": "{{status}}",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 9,
              "type": "stat",
              "title": "Origin total requests by host",
              "gridPos": {
                "x": 0,
                "y": 19,
                "w": 8,
                "h": 6
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "targets": [
                {
                  "expr": "sum by (host) (townhome_http_response_count_total{host=~\"townhome.*\"})",
                  "legendFormat": "{{host}}",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "short"
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ]
                },
                "colorMode": "value",
                "textMode": "value_and_name"
              }
            },
            {
              "id": 10,
              "type": "stat",
              "title": "Log parse errors",
              "gridPos": {
                "x": 8,
                "y": 19,
                "w": 6,
                "h": 6
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "targets": [
                {
                  "expr": "townhome_parse_errors_total",
                  "legendFormat": "errors",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green"
                      },
                      {
                        "color": "red",
                        "value": 1
                      }
                    ]
                  }
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ]
                },
                "colorMode": "background",
                "textMode": "value"
              }
            },
            {
              "id": 11,
              "type": "stat",
              "title": "Origin 5xx ratio (15m)",
              "gridPos": {
                "x": 14,
                "y": 19,
                "w": 10,
                "h": 6
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "targets": [
                {
                  "expr": "(sum(rate(townhome_http_response_count_total{host=\"townhome.theramirez.casa\",status=~\"5..\"}[15m])) or vector(0)) / clamp_min(sum(rate(townhome_http_response_count_total{host=\"townhome.theramirez.casa\"}[15m])), 0.001)",
                  "legendFormat": "5xx ratio",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green"
                      },
                      {
                        "color": "yellow",
                        "value": 0.01
                      },
                      {
                        "color": "red",
                        "value": 0.05
                      }
                    ]
                  }
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ]
                },
                "colorMode": "background",
                "textMode": "value"
              }
            },
            {
              "id": 12,
              "type": "timeseries",
              "title": "Origin p50 / p90 / p99 response time (prod)",
              "gridPos": {
                "x": 0,
                "y": 25,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "s"
                }
              },
              "targets": [
                {
                  "expr": "histogram_quantile(0.50, sum by (le) (rate(townhome_http_response_time_seconds_hist_bucket{host=\"townhome.theramirez.casa\"}[5m])))",
                  "legendFormat": "p50",
                  "refId": "A"
                },
                {
                  "expr": "histogram_quantile(0.90, sum by (le) (rate(townhome_http_response_time_seconds_hist_bucket{host=\"townhome.theramirez.casa\"}[5m])))",
                  "legendFormat": "p90",
                  "refId": "B"
                },
                {
                  "expr": "histogram_quantile(0.99, sum by (le) (rate(townhome_http_response_time_seconds_hist_bucket{host=\"townhome.theramirez.casa\"}[5m])))",
                  "legendFormat": "p99",
                  "refId": "C"
                }
              ]
            },
            {
              "id": 13,
              "type": "timeseries",
              "title": "Origin response bytes / sec (prod)",
              "gridPos": {
                "x": 12,
                "y": 25,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "Bps"
                }
              },
              "targets": [
                {
                  "expr": "sum(rate(townhome_http_response_size_bytes{host=\"townhome.theramirez.casa\"}[5m]))",
                  "legendFormat": "bytes/sec",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 14,
              "type": "stat",
              "title": "Unique visitors today (prod, UTC)",
              "gridPos": {
                "x": 0,
                "y": 33,
                "w": 6,
                "h": 6
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "targets": [
                {
                  "expr": "townhome_unique_visitors_today{host=\"townhome.theramirez.casa\"}",
                  "legendFormat": "today",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "short"
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ]
                },
                "colorMode": "value",
                "textMode": "value"
              }
            },
            {
              "id": 15,
              "type": "stat",
              "title": "Unique visitors yesterday (prod, UTC)",
              "gridPos": {
                "x": 6,
                "y": 33,
                "w": 6,
                "h": 6
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "targets": [
                {
                  "expr": "townhome_unique_visitors_yesterday{host=\"townhome.theramirez.casa\"}",
                  "legendFormat": "yesterday",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "short"
                }
              },
              "options": {
                "reduceOptions": {
                  "calcs": [
                    "lastNotNull"
                  ]
                },
                "colorMode": "value",
                "textMode": "value"
              }
            },
            {
              "id": 16,
              "type": "timeseries",
              "title": "Unique visitors today by host",
              "gridPos": {
                "x": 12,
                "y": 33,
                "w": 12,
                "h": 8
              },
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "short"
                }
              },
              "targets": [
                {
                  "expr": "townhome_unique_visitors_today{host=~\"townhome.*\"}",
                  "legendFormat": "{{host}}",
                  "refId": "A"
                }
              ]
            }
          ]
        }
      ]
    }
