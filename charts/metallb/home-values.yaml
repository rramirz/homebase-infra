apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: home-network
  namespace: metallb-system
spec:
  addresses:
  - 192.168.1.80-192.168.1.85
  - 192.168.2.80-192.168.2.85
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: home-network
  namespace: metallb-system
spec:
  ipAddressPools:
  - home-network

