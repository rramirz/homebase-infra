# Static validation example ONLY. Copy to values-personal.secret-values.yaml
# (gitignored, mode 0600) and replace every placeholder with a real generated
# value (>=32 chars, the three auth/tool/JWT secrets pairwise distinct). Never
# deploy this file as-is, and never commit the real file.
#
# `testMode: true` is static-validation-only. It lets `helm lint` and the
# render-contract tests pass with the exact `static-validation-only-*`
# placeholder shape and skips ONLY the release-name check (helm lint cannot
# set a release name). It does NOT bypass namespace, hostname/public-URL,
# image-pin, secret-presence, secret-length, or pairwise-distinct validation.
#
# Live tasks (`paperclip:render`/`dry-run`/`upgrade`/`bootstrap-deploy`)
# reject any file that sets a `testMode` key at all (via
# tests/validate-secret-file.sh), so the real values-personal.secret-values.yaml
# must omit testMode and hold real, non-placeholder secrets.
testMode: true
secrets:
  postgres:
    password: static-validation-only-postgres-password-0000000000000000000000000000000000
  betterAuthSecret: static-validation-only-better-auth-secret-111111111111111111111111111111111111
  toolActionSigningSecret: static-validation-only-tool-signing-secret-222222222222222222222222222222222222
  agentJwtSecret: static-validation-only-agent-jwt-secret-333333333333333333333333333333333333333333
