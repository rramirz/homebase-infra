{{- if .Values.enabled }}
{{- $fullname := include "paperclip.fullname" . -}}
{{- $labels := include "paperclip.labels" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ $fullname }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- $labels | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- $labels | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "{{ .Values.image.postgres.repository }}:{{ .Values.image.postgres.tag }}@{{ .Values.image.postgres.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Runs as root by design: docker-entrypoint.sh chowns PGDATA then
          # drops to the postgres user via gosu. We intentionally do NOT set
          # capabilities.drop: ["ALL"] (would remove CAP_CHOWN/CAP_SETUID).
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources.postgres | nindent 12 }}
  # volumeClaimTemplate PVCs are retained by StatefulSet lifecycle behavior:
  # helm uninstall deletes the StatefulSet object but NOT the `data-<pod>-0`
  # PVC it created, so the PostgreSQL data directory survives release removal.
  # The paperclip task workflow must never delete this PVC.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.postgresStorageSize }}
{{- end }}
