{{- if .Values.enabled }}
{{- $fullname := include "paperclip.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
    app.kubernetes.io/component: paperclip
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "paperclip.labels" . | nindent 6 }}
      app.kubernetes.io/component: paperclip
  template:
    metadata:
      labels:
        {{- include "paperclip.labels" . | nindent 8 }}
        app.kubernetes.io/component: paperclip
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paperclip
          image: "{{ .Values.image.paperclip.repository }}:{{ .Values.image.paperclip.tag }}@{{ .Values.image.paperclip.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Runs as root by design: the pinned Paperclip image entrypoint chowns
          # /paperclip before dropping privileges (chown-then-gosu). We
          # intentionally do NOT set capabilities.drop: ["ALL"] because that
          # would remove CAP_CHOWN and break startup. Only
          # allowPrivilegeEscalation is disabled.
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
            - name: SERVE_UI
              value: {{ .Values.env.SERVE_UI | quote }}
            - name: PAPERCLIP_HOME
              value: {{ .Values.env.PAPERCLIP_HOME | quote }}
            - name: PAPERCLIP_DEPLOYMENT_MODE
              value: {{ .Values.env.PAPERCLIP_DEPLOYMENT_MODE | quote }}
            - name: PAPERCLIP_DEPLOYMENT_EXPOSURE
              value: {{ .Values.env.PAPERCLIP_DEPLOYMENT_EXPOSURE | quote }}
            - name: PAPERCLIP_MIGRATION_AUTO_APPLY
              value: {{ .Values.env.PAPERCLIP_MIGRATION_AUTO_APPLY | quote }}
            - name: PAPERCLIP_PUBLIC_URL
              value: {{ .Values.env.PAPERCLIP_PUBLIC_URL | quote }}
            - name: PAPERCLIP_AUTH_DISABLE_SIGN_UP
              value: {{ .Values.env.PAPERCLIP_AUTH_DISABLE_SIGN_UP | quote }}
            - name: PAPERCLIP_AUTH_RATE_LIMIT_ENABLED
              value: {{ .Values.env.PAPERCLIP_AUTH_RATE_LIMIT_ENABLED | quote }}
            - name: PAPERCLIP_AGENT_JWT_DISABLE_LEGACY_FALLBACK
              value: {{ .Values.env.PAPERCLIP_AGENT_JWT_DISABLE_LEGACY_FALLBACK | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}
                  key: BETTER_AUTH_SECRET
            - name: PAPERCLIP_TOOL_ACTION_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}
                  key: PAPERCLIP_TOOL_ACTION_SIGNING_SECRET
            - name: PAPERCLIP_AGENT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}
                  key: PAPERCLIP_AGENT_JWT_SECRET
          volumeMounts:
            - name: paperclip
              mountPath: /paperclip
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.probe.hostHeader | quote }}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.probe.hostHeader | quote }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.probe.hostHeader | quote }}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources.app | nindent 12 }}
      volumes:
        - name: paperclip
          persistentVolumeClaim:
            claimName: {{ $fullname }}-paperclip
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
