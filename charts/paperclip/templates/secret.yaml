{{- if .Values.enabled }}
{{- $fullname := include "paperclip.fullname" . -}}
{{- $secrets := .Values.secrets | default dict -}}
{{- $pg := $secrets.postgres | default dict -}}
{{- $pgPassword := $pg.password | default "" -}}
{{- $pgHost := printf "%s-postgres" $fullname -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%d/%s" (.Values.postgres.user | urlquery | replace "+" "%20") ($pgPassword | urlquery | replace "+" "%20") $pgHost (int .Values.postgres.port) .Values.postgres.database | quote }}
  BETTER_AUTH_SECRET: {{ ($secrets.betterAuthSecret | default "") | quote }}
  PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: {{ ($secrets.toolActionSigningSecret | default "") | quote }}
  PAPERCLIP_AGENT_JWT_SECRET: {{ ($secrets.agentJwtSecret | default "") | quote }}
{{- end }}
