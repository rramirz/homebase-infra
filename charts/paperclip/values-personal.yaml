# ACTIVE personal overlay — BOOTSTRAP phase (route-disabled, signup-open).
#
# This is the safe first install state: no HTTPRoute is created and the app is
# reachable only through a local port-forward to http://localhost:3100, with
# signup enabled so the admin can claim the board. Apply the post-claim overlay
# (values-personal-claimed.yaml) on top of this file only after the admin has
# been claimed.
enabled: true
profile: personal
release: paperclip-personal
namespace: paperclip-personal
fullnameOverride: paperclip-personal
hostname: paperclip.theramirez.casa
httpRoute:
  enabled: false
env:
  PAPERCLIP_PUBLIC_URL: http://localhost:3100
  PAPERCLIP_AUTH_DISABLE_SIGN_UP: "false"
probe:
  hostHeader: localhost:3100
