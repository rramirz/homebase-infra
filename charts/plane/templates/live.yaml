apiVersion: v1
kind: Service
metadata:
  # Bare name, not release-derived: the official Plane Caddyfile (verified
  # directly against the pinned makeplane/plane-proxy:v1.3.1 image's
  # /etc/caddy/Caddyfile) hardcodes `reverse_proxy /live/* live:3000` as a
  # literal upstream host, with no templating of its own. This Service must
  # be named exactly `live` for Task 5's Caddy to resolve it, regardless of
  # Helm release name. Safe in this chart's dedicated `plane` namespace.
  name: live
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: live
spec:
  type: ClusterIP
  ports:
    - name: live
      port: {{ .Values.ports.live }}
      targetPort: live
      protocol: TCP
  selector:
    {{- include "plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: live
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plane.fullname" . }}-live
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: live
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "plane.labels" . | nindent 6 }}
      app.kubernetes.io/component: live
  template:
    metadata:
      labels:
        {{- include "plane.labels" . | nindent 8 }}
        app.kubernetes.io/component: live
    spec:
      containers:
        # No command/args override: runs the pinned image's own default CMD
        # (node apps/live, verified via `docker inspect`). API_BASE_URL and
        # LIVE_SERVER_SECRET_KEY have no defaults in this image's own env
        # schema (verified inside the pinned image's dist/start.mjs) and
        # are required for it to start at all.
        - name: live
          image: "{{ .Values.image.plane.repository }}/plane-live:{{ .Values.image.plane.tag }}@{{ .Values.image.plane.digests.live }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: live
              containerPort: {{ .Values.ports.live }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.ports.live | quote }}
            # Bare "api" host, matching the Service rename below and the
            # official Caddyfile's own hardcoded `api:8000` upstream.
            - name: API_BASE_URL
              value: {{ printf "http://api:%d" (int .Values.ports.api) | quote }}
            - name: LIVE_SERVER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "plane.fullname" . }}-secrets
                  key: LIVE_SERVER_SECRET_KEY
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plane.fullname" . }}-config
                  key: REDIS_URL
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plane.fullname" . }}-config
                  key: CORS_ALLOWED_ORIGINS
          resources:
            {{- toYaml .Values.resources.live | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.live.http.path }}
              port: {{ .Values.probes.live.http.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.live.http.path }}
              port: {{ .Values.probes.live.http.port }}
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
