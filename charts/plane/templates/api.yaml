apiVersion: v1
kind: Service
metadata:
  # Bare name, not release-derived: the official Plane Caddyfile (verified
  # directly against the pinned makeplane/plane-proxy:v1.3.1 image's
  # /etc/caddy/Caddyfile) hardcodes `reverse_proxy /api/* api:8000` (plus
  # /auth/*, /static/*) as a literal upstream host. Must be named exactly
  # `api` for Task 5's Caddy to resolve it. Safe in this chart's dedicated
  # `plane` namespace.
  name: api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: api
      port: {{ .Values.ports.api }}
      targetPort: api
      protocol: TCP
  selector:
    {{- include "plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plane.fullname" . }}-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "plane.labels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "plane.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      # First-install migration gate: the official docker-entrypoint-api.sh
      # already calls `manage.py wait_for_migrations` itself (confirmed
      # against the pinned image, unmodified below), which correctly blocks
      # through every upgrade. But on a genuinely fresh database, the
      # django_migrations table doesn't exist at all until the migrator
      # Job's first run completes; this init container gives that state a
      # visible, cheap (psql-only, no Python/Django import) precondition
      # instead of the api pod crash-looping/hanging opaquely while waiting
      # on the (heavier) backend image to do the same wait internally.
      initContainers:
        - name: wait-for-migrations
          image: "{{ .Values.image.postgres.repository }}:{{ .Values.image.postgres.tag }}@{{ .Values.image.postgres.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              i=0
              until PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT 1 FROM django_migrations LIMIT 1" 2>/dev/null | grep -q '^1$'; do
                i=$((i + 1))
                if [ "$i" -ge 120 ]; then
                  echo "Timed out waiting for the initial Plane migration to complete" >&2
                  exit 1
                fi
                echo "Waiting for initial migration ($i/120)..."
                sleep 5
              done
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plane.fullname" . }}-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plane.fullname" . }}-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plane.fullname" . }}-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "plane.fullname" . }}-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "plane.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
      containers:
        # No command/args override: runs the pinned image's own default CMD
        # (./bin/docker-entrypoint-api.sh, verified via `docker inspect`),
        # which itself still runs `wait_for_db`/`wait_for_migrations` before
        # `exec gunicorn ...` — that upgrade-safe behavior is preserved
        # unmodified.
        - name: api
          image: "{{ .Values.image.plane.repository }}/plane-backend:{{ .Values.image.plane.tag }}@{{ .Values.image.plane.digests.backend }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: api
              containerPort: {{ .Values.ports.api }}
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "plane.fullname" . }}-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "plane.fullname" . }}-secrets
                  key: SECRET_KEY
            - name: AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "plane.fullname" . }}-secrets
                  key: AMQP_URL
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "plane.fullname" . }}-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "plane.fullname" . }}-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plane.fullname" . }}-config
                  key: REDIS_URL
            - name: WEB_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plane.fullname" . }}-config
                  key: WEB_URL
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plane.fullname" . }}-config
                  key: CORS_ALLOWED_ORIGINS
            - name: USE_MINIO
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plane.fullname" . }}-config
                  key: USE_MINIO
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plane.fullname" . }}-config
                  key: AWS_REGION
            - name: AWS_S3_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plane.fullname" . }}-config
                  key: AWS_S3_ENDPOINT_URL
            - name: AWS_S3_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plane.fullname" . }}-config
                  key: AWS_S3_BUCKET_NAME
            - name: FILE_SIZE_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plane.fullname" . }}-config
                  key: FILE_SIZE_LIMIT
            - name: GUNICORN_WORKERS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "plane.fullname" . }}-config
                  key: GUNICORN_WORKERS
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.api.http.path }}
              port: {{ .Values.probes.api.http.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.api.http.path }}
              port: {{ .Values.probes.api.http.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
