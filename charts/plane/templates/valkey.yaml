apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "plane.fullname" . }}-valkey
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.valkey.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.valkey.host }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  type: ClusterIP
  ports:
    - name: valkey
      port: {{ .Values.valkey.port }}
      targetPort: valkey
      protocol: TCP
  selector:
    {{- include "plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plane.fullname" . }}-valkey
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "plane.labels" . | nindent 6 }}
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        {{- include "plane.labels" . | nindent 8 }}
        app.kubernetes.io/component: valkey
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.image.valkey.repository }}:{{ .Values.image.valkey.tag }}@{{ .Values.image.valkey.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Runs as root at startup by design: docker-entrypoint.sh chowns
          # /data then drops to the valkey user via setpriv itself (verified
          # against the actual entrypoint script). Dropping all Linux
          # capabilities would remove CAP_CHOWN/CAP_SETUID and break that
          # drop, so only allowPrivilegeEscalation is disabled.
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: valkey
              containerPort: {{ .Values.valkey.port }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.resources.valkey | nindent 12 }}
          readinessProbe:
            exec:
              command:
                {{- toYaml .Values.probes.valkey.exec.command | nindent 16 }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                {{- toYaml .Values.probes.valkey.exec.command | nindent 16 }}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "plane.fullname" . }}-valkey
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
