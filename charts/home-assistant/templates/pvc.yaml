apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "home-assistant.fullname" . }}-pvc
  labels:
    app: {{ include "home-assistant.name" . }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  {{- if .Values.persistence.matchLabels }}
  selector:
    matchLabels:
      {{- range $key, $value := .Values.persistence.matchLabels }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
  {{- end }}
  {{- if .Values.persistence.matchExpressions }}
  selector:
    matchExpressions:
      {{- range .Values.persistence.matchExpressions }}
      - key: {{ .key }}
        operator: {{ .operator }}
        values:
          {{- range .values }}
          - {{ . | quote }}
          {{- end }}
      {{- end }}
  {{- end }}

