---
- name: Setup iSCSI initiator on K8s nodes
  hosts: home_base
  tasks:
    - name: Install open-iscsi package
      apt:
        name: open-iscsi
        state: present
        update_cache: true

    - name: Enable and start open-iscsi service
      systemd:
        name: open-iscsi
        state: started
        enabled: true

    - name: Configure iSCSI initiator name
      lineinfile:
        path: /etc/iscsi/initiatorname.iscsi
        regexp: '^InitiatorName='
        line: "InitiatorName={{ iscsi_iqn }}"
      notify: restart iscsi

    - name: Discover iSCSI target
      command: iscsiadm -m discovery -t st -p {{ iscsi_target_ip }}
      register: discovery_result
      failed_when: discovery_result.rc != 0 and "already exists" not in discovery_result.stderr
      changed_when: "'New targets' in discovery_result.stdout"

    - name: Login to iSCSI target
      command: iscsiadm -m node -T {{ iscsi_iqn }} -p {{ iscsi_target_ip }} --login
      register: login_result
      failed_when: login_result.rc != 0 and "session exists" not in login_result.stderr
      changed_when: login_result.rc == 0

  handlers:
    - name: restart iscsi
      systemd:
        name: open-iscsi
        state: restarted
