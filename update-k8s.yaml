---
- name: Hold Kubernetes packages before upgrade
  hosts: home_base
  tasks:
    - name: Hold Kubernetes packages (safety measure)
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet
        - kubectl

- name: Fetch and install selected Kubernetes version
  hosts: home_base
  gather_facts: false
  tasks:
    - name: Prompt for Kubernetes minor repo
      run_once: true
      pause:
        prompt: "Kubernetes minor repo to use (e.g., v1.35) [{{ k8s_major_minor }}]"
        echo: true
      register: minor_input
      when: k8s_minor_override is not defined

    - name: Set Kubernetes minor repo for all hosts
      run_once: true
      set_fact:
        k8s_major_minor: >-
          {{ k8s_minor_override | default(minor_input.user_input | trim | default(k8s_major_minor, true), true) }}

    - name: Validate Kubernetes minor format
      run_once: true
      assert:
        that: k8s_major_minor is match('^v1\.[0-9]+$')
        fail_msg: "k8s_major_minor must look like v1.35"

    - name: Setup Kubernetes apt repository
      include_tasks: tasks/k8s-apt-repo.yaml

    - name: Update apt cache
      apt:
        update_cache: true

    - name: Fetch available kubeadm versions
      run_once: true
      shell: apt-cache madison kubeadm | awk '{print $3}' | sort -Vr | head -20
      register: available_versions
      changed_when: false

    - name: Show available kubeadm versions
      run_once: true
      debug:
        var: available_versions.stdout_lines

    - name: Prompt for Kubernetes version
      run_once: true
      pause:
        prompt: "Enter the version to install (e.g., {{ k8s_major_minor[1:] }}.0-1.1)"
      register: user_input
      when: k8s_version_override is not defined

    - name: Set selected version for all hosts
      set_fact:
        selected_version: "{{ k8s_version_override | default(user_input.user_input) }}"
      run_once: true

    - name: Unhold Kubernetes packages
      dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop:
        - kubeadm
        - kubelet
        - kubectl

    - name: Install selected Kubernetes version
      apt:
        name:
          - "kubeadm={{ selected_version }}"
          - "kubelet={{ selected_version }}"
          - "kubectl={{ selected_version }}"
        state: present
        update_cache: true

    - name: Hold Kubernetes packages at new version
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet
        - kubectl

- name: Upgrade Kubernetes master node
  hosts: k8s_master
  tasks:
    - name: Apply kubeadm upgrade on master
      command: >
        kubeadm upgrade apply
        {{ hostvars[groups['home_base'] | first].selected_version.split('-')[0] }} -y

- name: Upgrade Kubernetes worker nodes
  hosts: k8s_nodes
  serial: 1
  tasks:
    - name: Upgrade node configuration
      command: kubeadm upgrade node

- name: Restart kubelet on all nodes
  hosts: k8s_master,k8s_nodes
  tasks:
    - name: Restart and enable kubelet
      systemd:
        name: kubelet
        state: restarted
        enabled: true
