---
- name: Fetch and install selected Kubernetes version on all nodes
  hosts: home_base
  become: true
  gather_facts: false
  remote_user: rramirez
  vars:
    k8s_major_minor: "v1.30"
    apt_list_url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_major_minor }}/deb/dists/stable/main/binary-amd64/Packages"
    keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  tasks:
    - name: Fetch available kubeadm versions
      shell: |
        curl -s "{{ apt_list_url }}" | \
        awk '/^Package: kubeadm/{p=1} p && /^Version:/{print $2; p=0}' | \
        sort -Vr | uniq
      register: available_versions
      changed_when: false

    - name: Show available kubeadm versions
      debug:
        msg: |
          Available versions:
          {{ available_versions.stdout_lines | join('\n') }}

    - name: Prompt for Kubernetes version
      pause:
        prompt: "Enter the version to install (copy/paste from above, e.g., 1.30.3-1.1): "
      register: user_input

    - name: Save selected version to file
      copy:
        dest: /tmp/k8s_selected_version.txt
        content: "{{ user_input.user_input }}"

    - name: Add Kubernetes GPG key
      apt_key:
        url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_major_minor }}/deb/Release.key"
        state: present
        keyring: "{{ keyring }}"

    - name: Set Kubernetes apt repository
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by={{ keyring }}] https://pkgs.k8s.io/core:/stable:/{{ k8s_major_minor }}/deb/ /
        backup: yes

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Unhold Kubernetes packages
      shell: apt-mark unhold kubeadm kubelet kubectl || true

    - name: Install selected Kubernetes version
      apt:
        name:
          - "kubeadm={{ user_input.user_input }}"
          - "kubelet={{ user_input.user_input }}"
          - "kubectl={{ user_input.user_input }}"
        update_cache: yes
        state: present

    - name: Hold Kubernetes packages
      shell: apt-mark hold kubeadm kubelet kubectl

- name: Upgrade Kubernetes master node
  hosts: k8s_master
  become: true
  remote_user: rramirez
  vars:
    k8s_base_version: "{{ lookup('file', '/tmp/k8s_selected_version.txt').split('-')[0] }}"
  tasks:
    - name: Apply kubeadm upgrade on master
      command: kubeadm upgrade apply {{ k8s_base_version }} -y

- name: Upgrade Kubernetes worker nodes
  hosts: k8s_nodes
  become: true
  remote_user: rramirez
  tasks:
    - name: Run kubeadm upgrade node
      command: kubeadm upgrade node

- name: Restart kubelet on all nodes
  hosts: k8s_master,k8s_nodes
  become: true
  remote_user: rramirez
  tasks:
    - name: Restart kubelet
      systemd:
        name: kubelet
        state: restarted
        enabled: yes

