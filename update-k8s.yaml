---
- name: Hold Kubernetes packages before upgrade
  hosts: home_base
  tasks:
    - name: Hold Kubernetes packages (safety measure)
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet
        - kubectl

- name: Fetch and install selected Kubernetes version
  hosts: home_base
  gather_facts: false
  tasks:
    - name: Setup Kubernetes apt repository
      include_tasks: tasks/k8s-apt-repo.yaml

    - name: Update apt cache
      apt:
        update_cache: true

    - name: Fetch available kubeadm versions
      run_once: true
      shell: apt-cache madison kubeadm | awk '{print $3}' | sort -Vr | head -20
      register: available_versions
      changed_when: false

    - name: Show available kubeadm versions
      run_once: true
      debug:
        var: available_versions.stdout_lines

    - name: Prompt for Kubernetes version
      run_once: true
      pause:
        prompt: "Enter the version to install (e.g., 1.34.0-1.1)"
      register: user_input

    - name: Set selected version for all hosts
      set_fact:
        selected_version: "{{ user_input.user_input }}"
      run_once: true

    - name: Unhold Kubernetes packages
      dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop:
        - kubeadm
        - kubelet
        - kubectl

    - name: Install selected Kubernetes version
      apt:
        name:
          - "kubeadm={{ selected_version }}"
          - "kubelet={{ selected_version }}"
          - "kubectl={{ selected_version }}"
        state: present
        update_cache: true

    - name: Hold Kubernetes packages at new version
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet
        - kubectl

- name: Upgrade Kubernetes master node
  hosts: k8s_master
  tasks:
    - name: Apply kubeadm upgrade on master
      command: >
        kubeadm upgrade apply
        {{ hostvars[groups['home_base'] | first].selected_version.split('-')[0] }} -y

- name: Upgrade Kubernetes worker nodes
  hosts: k8s_nodes
  serial: 1
  tasks:
    - name: Upgrade node configuration
      command: kubeadm upgrade node

- name: Restart kubelet on all nodes
  hosts: k8s_master,k8s_nodes
  tasks:
    - name: Restart and enable kubelet
      systemd:
        name: kubelet
        state: restarted
        enabled: true
