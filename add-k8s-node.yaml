- name: Set authorized key took from file
  hosts: bootstrap
  user: rramirez
  tasks:
  # - name: add rramirez to sudo
  #   become: true
  #   become_method: su
  #   command: usermod -aG sudo rramirez
  
  - name: Disable Swap
    become: true
    become_method: sudo
    replace:
      path: /etc/fstab
      regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
      replace: '# \1'

  - name: Install dependencies
    become: true
    apt:
      name:
        - containerd
        - curl
        - gnupg2
      state: latest
      update_cache: no

  - name: Configure prerequisites
    become: true
    shell:
      cmd: |
        cat <<EOF | sudo tee /etc/modules-load.d/containerd.conf
        overlay
        br_netfilter
        EOF
        modprobe overlay
        modprobe br_netfilter
        cat <<EOF | sudo tee /etc/sysctl.d/99-kubernetes-cri.conf
        net.bridge.bridge-nf-call-iptables = 1
        net.ipv4.ip_forward = 1
        net.bridge.bridge-nf-call-ip6tables = 1
        EOF
        sysctl --system
        apt-get update
        apt-get -y install containerd
        sudo mkdir -p /etc/containerd
        curl -s https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo apt-key add
        cat <<EOF | sudo tee /etc/apt/sources.list.d/kubernetes.list
        deb https://apt.kubernetes.io/ kubernetes-xenial main
        EOF

  - name: Set the configuration file for containerd
    become: true 
    copy:
      src: configs/containerd-config.toml
      dest: /etc/containerd/config.toml
      owner: root
      group: root
      mode: 0644

  - name: Restart containerd
    become: true
    systemd:
      name: containerd
      state: restarted

  # - name: join k8s cluster
  #   become: true
  #   command: kubeadm join 192.168.1.50:6443 --token MY_TOKEN  --discovery-token-ca-cert-hash MY_HASH
