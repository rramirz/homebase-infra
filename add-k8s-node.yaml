---
- name: Bootstrap new Kubernetes node
  hosts: bootstrap
  tasks:
    - name: Disable swap in fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        replace: '# \1'

    - name: Disable swap immediately
      command: swapoff -a
      changed_when: false

    - name: Load required kernel modules
      command: modprobe {{ item }}
      changed_when: false
      loop:
        - overlay
        - br_netfilter

    - name: Persist kernel modules across reboots
      copy:
        dest: /etc/modules-load.d/containerd.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Configure sysctl for Kubernetes networking
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-kubernetes-cri.conf
        reload: true
      loop:
        - { key: net.bridge.bridge-nf-call-iptables, value: "1" }
        - { key: net.ipv4.ip_forward, value: "1" }
        - { key: net.bridge.bridge-nf-call-ip6tables, value: "1" }

    - name: Install containerd and dependencies
      apt:
        name:
          - containerd
          - curl
          - gnupg2
        state: present
        update_cache: true

    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy containerd configuration
      copy:
        src: configs/containerd-config.toml
        dest: /etc/containerd/config.toml
        owner: root
        group: root
        mode: "0644"
      notify: restart containerd

    - name: Setup Kubernetes apt repository
      include_tasks: tasks/k8s-apt-repo.yaml

    - name: Install Kubernetes packages
      apt:
        name:
          - kubeadm
          - kubelet
          - kubectl
        state: present
        update_cache: true

    - name: Hold Kubernetes packages at current version
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet
        - kubectl

    - name: Deploy swapoff script
      copy:
        src: configs/swapoff.sh
        dest: /root/swapoff.sh
        owner: root
        group: root
        mode: "0755"

    - name: Deploy swapoff systemd unit
      copy:
        src: configs/swapoff.service
        dest: /etc/systemd/system/swapoff.service
        owner: root
        group: root
        mode: "0644"
      notify: restart swapoff

    - name: Enable and start swapoff service
      systemd:
        name: swapoff
        enabled: true
        state: started

    - name: Enable and start kubelet
      systemd:
        name: kubelet
        enabled: true
        state: started

  handlers:
    - name: restart containerd
      systemd:
        name: containerd
        state: restarted

    - name: restart swapoff
      systemd:
        name: swapoff
        daemon_reload: true
        state: restarted
