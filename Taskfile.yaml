version: '3'

vars:
  ANSIBLE: ansible-playbook
  CHARTS_DIR: charts/prometheus-stack
  MONITORING_NS: monitoring
  BACKBLAZE_CHARTS_DIR: charts/backblaze-wine
  BACKBLAZE_NS: backblaze
  VERSION_CHECKER_CHARTS_DIR: charts/version-checker
  MEALIE_CHARTS_DIR: charts/mealie
  MEALIE_NS: mealie
  PLANE_CHARTS_DIR: charts/plane
  PLANE_NS: plane
  FLANNEL_CHARTS_DIR: charts/flannel
  FLANNEL_NS: kube-flannel
  RETIREMENT_APP_DIR: apps/family-retirement-planner
  RETIREMENT_CHART_DIR: apps/family-retirement-planner/chart

env:
  ANSIBLE_FORCE_COLOR: 'true'
  DEBIAN_FRONTEND: noninteractive

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  inventory:
    desc: Show Ansible inventory graph
    cmds:
      - ansible-inventory --graph

  check:kubernetes-health:
    aliases: [k8s:status]
    desc: Check active Kubernetes nodes and list pods that are not Running/Succeeded
    cmds:
      - kubectl get nodes -o wide
      - kubectl get pods -A --field-selector=status.phase!=Running,status.phase!=Succeeded -o wide

  check:proxmox-guests:
    aliases: [proxmox:guests]
    desc: Check Proxmox VM/LXC inventory on both hypervisors without changing anything
    cmds:
      - ssh -o BatchMode=yes -o ConnectTimeout=8 root@192.168.1.216 'hostname; qm list; pct list'
      - ssh -o BatchMode=yes -o ConnectTimeout=8 root@192.168.1.28 'hostname; qm list; pct list'

  check:nas-and-sync-storage:
    aliases: [nas:health]
    desc: Check NAS ZFS pool health plus Syncthing LXC root filesystem usage
    cmds:
      - ssh -o BatchMode=yes -o ConnectTimeout=8 root@192.168.1.216 'zpool status home-storage; zpool list home-storage; zfs list -o name,used,avail,refer,mountpoint -r home-storage/home-cloud/home-share | sed -n "1,20p"; pct exec 105 -- df -hT /'

  install:node-exporters-ssh-servers:
    aliases: [exporters:install]
    desc: Install or update Prometheus node-exporter on SSH-managed hosts in [servers]
    cmds:
      - '{{.ANSIBLE}} node-exporters.yaml'

  install:node-exporters-proxmox-lxcs:
    aliases: [exporters:lxc]
    desc: Install or update Prometheus node-exporter inside Proxmox-managed LXCs via pct exec
    cmds:
      - ANSIBLE_BECOME_ASK_PASS=false {{.ANSIBLE}} node-exporters-proxmox-lxc.yaml

  install:all-node-exporters:
    aliases: [exporters:all]
    desc: Install or update all Prometheus node-exporters on SSH hosts and Proxmox-managed LXCs
    cmds:
      - task: install:node-exporters-ssh-servers
      - task: install:node-exporters-proxmox-lxcs

  update:active-kubernetes-node-os:
    aliases: [os:update-k8s-nodes]
    desc: Dist-upgrade OS packages on active Kubernetes nodes and reboot only when required
    cmds:
      - '{{.ANSIBLE}} update-homebase.yaml'

  update:ssh-managed-server-os-no-reboot:
    aliases: [os:update-servers]
    desc: Dist-upgrade OS packages on SSH-managed servers and only report required reboots
    cmds:
      - '{{.ANSIBLE}} update-servers.yaml'

  update:ssh-managed-server-os-with-reboot:
    aliases: [os:update-servers-reboot]
    desc: Dist-upgrade OS packages on SSH-managed servers and reboot hosts that require it
    prompt: This can reboot hosts one at a time. Continue?
    cmds:
      - '{{.ANSIBLE}} update-servers.yaml -e reboot_if_required=true'

  update:proxmox-packages-no-reboot:
    desc: Dist-upgrade packages serially on [proxmox] and only report required reboots
    cmds:
      - '{{.ANSIBLE}} update-proxmox.yaml'

  update:proxmox-packages-with-reboot:
    desc: Dist-upgrade packages and reboot one exact PVE_HOST only if required
    prompt: This can reboot the selected Proxmox hypervisor. Continue?
    preconditions:
      - sh: 'case "{{.PVE_HOST}}" in pve-1|pve-2) exit 0 ;; *) exit 1 ;; esac'
        msg: Set PVE_HOST to exactly pve-1 or pve-2; multi-host Proxmox reboots are refused.
    cmds:
      - '{{.ANSIBLE}} update-proxmox.yaml --limit {{.PVE_HOST}} -e reboot_if_required=true'

  proxmox:major:preflight:
    desc: Read-only PVE 8 to 9 preflight for exactly one PVE_HOST; requires backup/outage acknowledgements
    vars:
      BACKUP_VERIFIED: '{{.BACKUP_VERIFIED | default "false"}}'
      OUTAGE_ACKNOWLEDGED: '{{.OUTAGE_ACKNOWLEDGED | default "false"}}'
    preconditions:
      - sh: 'case "{{.PVE_HOST}}" in pve-1|pve-2) exit 0 ;; *) exit 1 ;; esac'
        msg: Set PVE_HOST to exactly pve-1 or pve-2; broad major-upgrade runs are refused.
    cmds:
      - >-
        {{.ANSIBLE}} proxmox-major-upgrade.yaml --limit {{.PVE_HOST}}
        -e phase=preflight -e pve_host={{.PVE_HOST}}
        -e backup_verified={{.BACKUP_VERIFIED}} -e outage_acknowledged={{.OUTAGE_ACKNOWLEDGED}}

  proxmox:major:upgrade:
    desc: Migrate exactly one verified PVE_HOST from PVE 8/bookworm to PVE 9/trixie; does not reboot
    prompt: This changes apt sources and dist-upgrades one Proxmox host. Continue only after preflight and outage planning?
    vars:
      BACKUP_VERIFIED: '{{.BACKUP_VERIFIED | default "false"}}'
      OUTAGE_ACKNOWLEDGED: '{{.OUTAGE_ACKNOWLEDGED | default "false"}}'
    preconditions:
      - sh: 'case "{{.PVE_HOST}}" in pve-1|pve-2) exit 0 ;; *) exit 1 ;; esac'
        msg: Set PVE_HOST to exactly pve-1 or pve-2; broad major-upgrade runs are refused.
    cmds:
      - >-
        {{.ANSIBLE}} proxmox-major-upgrade.yaml --limit {{.PVE_HOST}}
        -e phase=upgrade -e pve_host={{.PVE_HOST}}
        -e backup_verified={{.BACKUP_VERIFIED}} -e outage_acknowledged={{.OUTAGE_ACKNOWLEDGED}}

  proxmox:major:reboot:
    desc: Reboot exactly one upgraded PVE_HOST; requires separate explicit confirmation
    prompt: This reboots one Proxmox host and interrupts its guests. Continue only during the approved outage?
    vars:
      OUTAGE_ACKNOWLEDGED: '{{.OUTAGE_ACKNOWLEDGED | default "false"}}'
      REBOOT_CONFIRMED: '{{.REBOOT_CONFIRMED | default "false"}}'
    preconditions:
      - sh: 'case "{{.PVE_HOST}}" in pve-1|pve-2) exit 0 ;; *) exit 1 ;; esac'
        msg: Set PVE_HOST to exactly pve-1 or pve-2; broad major-upgrade runs are refused.
    cmds:
      - >-
        {{.ANSIBLE}} proxmox-major-upgrade.yaml --limit {{.PVE_HOST}}
        -e phase=reboot -e pve_host={{.PVE_HOST}}
        -e outage_acknowledged={{.OUTAGE_ACKNOWLEDGED}} -e reboot_confirmed={{.REBOOT_CONFIRMED}}

  proxmox:major:resume:
    desc: Resume exactly one interrupted target upgrade only with canonical trixie sources and explicit confirmation
    prompt: This resumes a partially completed PVE target upgrade. Continue only after manual package recovery review?
    vars:
      BACKUP_VERIFIED: '{{.BACKUP_VERIFIED | default "false"}}'
      OUTAGE_ACKNOWLEDGED: '{{.OUTAGE_ACKNOWLEDGED | default "false"}}'
      RESUME_CONFIRMED: '{{.RESUME_CONFIRMED | default "false"}}'
    preconditions:
      - sh: 'case "{{.PVE_HOST}}" in pve-1|pve-2) exit 0 ;; *) exit 1 ;; esac'
        msg: Set PVE_HOST to exactly pve-1 or pve-2; broad major-upgrade runs are refused.
    cmds:
      - >-
        {{.ANSIBLE}} proxmox-major-upgrade.yaml --limit {{.PVE_HOST}}
        -e phase=resume -e pve_host={{.PVE_HOST}} -e backup_verified={{.BACKUP_VERIFIED}}
        -e outage_acknowledged={{.OUTAGE_ACKNOWLEDGED}} -e resume_confirmed={{.RESUME_CONFIRMED}}

  proxmox:major:verify:
    desc: Read-only PVE 9/trixie verification for exactly one PVE_HOST
    preconditions:
      - sh: 'case "{{.PVE_HOST}}" in pve-1|pve-2) exit 0 ;; *) exit 1 ;; esac'
        msg: Set PVE_HOST to exactly pve-1 or pve-2; broad major-upgrade runs are refused.
    cmds:
      - '{{.ANSIBLE}} proxmox-major-upgrade.yaml --limit {{.PVE_HOST}} -e phase=verify -e pve_host={{.PVE_HOST}}'

  update:kubernetes-version:
    aliases: [k8s:upgrade]
    desc: Upgrade Kubernetes packages/control plane/workers to an interactively selected version
    prompt: This upgrades Kubernetes packages and restarts kubelet. Continue?
    cmds:
      - '{{.ANSIBLE}} update-k8s.yaml'

  update:plex-media-server:
    aliases: [plex:update]
    desc: Download and install latest Plex Media Server package in the Plex LXC
    cmds:
      - '{{.ANSIBLE}} update-plex.yaml'

  update:syncthing-lxc:
    aliases: [syncthing:update]
    desc: Back up and update Syncthing in the Proxmox-managed sync LXC
    cmds:
      - ANSIBLE_BECOME_ASK_PASS=false {{.ANSIBLE}} update-syncthing-lxc.yaml

  monitoring:render-prometheus-stack:
    aliases: [monitoring:render]
    desc: Render prometheus-stack Helm chart locally to catch template errors before upgrade
    dir: '{{.CHARTS_DIR}}'
    cmds:
      - helm template prometheus-stack . -n {{.MONITORING_NS}} -f values.yaml >/tmp/prometheus-stack-render.yaml

  monitoring:upgrade-prometheus-stack:
    aliases: [monitoring:upgrade]
    desc: Apply prometheus-stack Helm values changes to the live monitoring namespace
    dir: '{{.CHARTS_DIR}}'
    cmds:
      - helm upgrade prometheus-stack . -n {{.MONITORING_NS}} -f values.yaml

  monitoring:apply-grafana-dashboards-and-rules:
    aliases: [monitoring:apply-dashboards]
    desc: Apply Grafana dashboard ConfigMaps and PrometheusRule files from the chart
    dir: '{{.CHARTS_DIR}}'
    cmds:
      - kubectl apply --server-side=true -n {{.MONITORING_NS}} -f dashboards/
      - kubectl apply -n {{.MONITORING_NS}} -f rules/

  monitoring:show-live-scrape-targets:
    aliases: [monitoring:targets]
    desc: Show node-external targets from the live Prometheus generated config
    cmds:
      - >-
        kubectl -n {{.MONITORING_NS}} get secret prometheus-prometheus-stack-kube-prom-prometheus
        -o jsonpath='{.data.prometheus\.yaml\.gz}' | base64 -d | gunzip |
        egrep 'job_name: node-external|192\.168\.1\.(13[5-9]|78|218|225|216|28):9100'

  monitoring:render-version-checker:
    desc: Render version-checker Helm chart locally to catch template errors before upgrade
    dir: '{{.VERSION_CHECKER_CHARTS_DIR}}'
    cmds:
      - helm dependency update .
      - helm template version-checker . -n {{.MONITORING_NS}} -f values.yaml >/tmp/version-checker-render.yaml

  monitoring:upgrade-version-checker:
    desc: Apply version-checker Helm values changes to the live monitoring namespace
    dir: '{{.VERSION_CHECKER_CHARTS_DIR}}'
    cmds:
      - helm upgrade version-checker . -n {{.MONITORING_NS}} -f values.yaml

  flannel:dependency:
    desc: Rebuild the vendored Flannel dependency from Chart.lock without touching the cluster
    dir: '{{.FLANNEL_CHARTS_DIR}}'
    cmds:
      - helm repo add flannel https://flannel-io.github.io/flannel --force-update
      - helm dependency build .

  flannel:lint:
    desc: Lint the pinned Flannel CNI Helm wrapper without touching the cluster
    dir: '{{.FLANNEL_CHARTS_DIR}}'
    deps: [flannel:dependency]
    cmds:
      - helm lint . -f values.yaml

  flannel:render:
    desc: Render the pinned Flannel CNI chart locally without touching the cluster
    dir: '{{.FLANNEL_CHARTS_DIR}}'
    deps: [flannel:dependency]
    cmds:
      - helm template flannel . -n {{.FLANNEL_NS}} -f values.yaml >/tmp/flannel-render.yaml

  flannel:diff:
    desc: Show the live Flannel release diff without applying changes
    dir: '{{.FLANNEL_CHARTS_DIR}}'
    deps: [flannel:dependency]
    preconditions:
      - sh: '[ "$(kubectl config current-context)" = "home-base" ]'
        msg: current kubectl context is not home-base - refusing to diff against the wrong cluster
    cmds:
      - helm diff upgrade flannel . -n {{.FLANNEL_NS}} -f values.yaml --reset-values

  flannel:dry-run:
    desc: Run a server-side Flannel Helm upgrade dry-run without mutating the cluster
    dir: '{{.FLANNEL_CHARTS_DIR}}'
    deps: [flannel:dependency]
    preconditions:
      - sh: '[ "$(kubectl config current-context)" = "home-base" ]'
        msg: current kubectl context is not home-base - refusing to dry-run against the wrong cluster
    cmds:
      - helm upgrade flannel . -n {{.FLANNEL_NS}} -f values.yaml --reset-values --dry-run=server

  flannel:upgrade:
    desc: Upgrade the live Flannel CNI release after the documented stable-baseline and image pre-pull checks
    deps: [flannel:dependency]
    prompt: This upgrades the cluster CNI and can disrupt every pod network path. Continue only after the Flannel runbook checks pass?
    preconditions:
      - sh: '[ "$(kubectl config current-context)" = "home-base" ]'
        msg: current kubectl context is not home-base - refusing to upgrade against the wrong cluster
    cmds:
      - helm upgrade flannel charts/flannel -n kube-flannel --reset-values --wait --timeout 10m

  flannel:rollback:
    desc: Roll Flannel back explicitly to release revision 1 and wait for the DaemonSet
    deps: [flannel:dependency]
    prompt: This rolls the cluster CNI back to Flannel release revision 1. Continue only under the documented abort procedure?
    preconditions:
      - sh: '[ "$(kubectl config current-context)" = "home-base" ]'
        msg: current kubectl context is not home-base - refusing to rollback against the wrong cluster
    cmds:
      - helm rollback flannel 1 -n kube-flannel --wait --timeout 10m

  flannel:verify:
    desc: Verify live Flannel nodes, release, DaemonSet, rendered image/config, probes, and toleration read-only
    deps: [flannel:dependency]
    preconditions:
      - sh: '[ "$(kubectl config current-context)" = "home-base" ]'
        msg: current kubectl context is not home-base - refusing to verify the wrong cluster
    cmds:
      - test "$(kubectl get --raw=/readyz)" = ok
      - kubectl get nodes -o wide
      - >-
        kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{" "}{range .status.conditions[?(@.type=="Ready")]}{.status}{"\n"}{end}{end}' |
        awk 'NF != 2 || $2 != "True" { exit 1 }'
      - helm status flannel -n kube-flannel
      - kubectl -n kube-flannel get daemonset kube-flannel-ds -o wide
      - >-
        kubectl -n kube-flannel get daemonset kube-flannel-ds
        -o jsonpath='{.status.desiredNumberScheduled} {.status.currentNumberScheduled} {.status.numberReady} {.status.numberAvailable}' |
        awk '$1 != 5 || $2 != 5 || $3 != 5 || $4 != 5 { exit 1 }'
      - >-
        test "$(kubectl -n kube-flannel get daemonset kube-flannel-ds
        -o jsonpath='{.spec.template.spec.containers[?(@.name=="kube-flannel")].image}')"
        = ghcr.io/flannel-io/flannel:v0.28.9
      - >-
        test "$(kubectl -n kube-flannel get daemonset kube-flannel-ds
        -o jsonpath='{.spec.template.spec.initContainers[?(@.name=="install-cni-plugin")].image}')"
        = ghcr.io/flannel-io/flannel-cni-plugin:v1.9.1-flannel3
      - >-
        kubectl -n kube-flannel get configmap kube-flannel-cfg
        -o jsonpath='{.data.net-conf\.json}' | grep -Fq '10.244.0.0/16'
      - >-
        kubectl -n kube-flannel get configmap kube-flannel-cfg
        -o jsonpath='{.data.net-conf\.json}' | grep -Fq '"Type": "vxlan"'
      - helm template flannel charts/flannel -n kube-flannel -f charts/flannel/values.yaml >/tmp/flannel-verify-render.yaml
      - >-
        grep -qF 'name: kube-flannel-ds' /tmp/flannel-verify-render.yaml
      - >-
        grep -qF 'name: kube-flannel-cfg' /tmp/flannel-verify-render.yaml
      - >-
        grep -qF 'name: flannel' /tmp/flannel-verify-render.yaml
      - >-
        grep -qF '10.244.0.0/16' /tmp/flannel-verify-render.yaml
      - >-
        grep -qF '"Type": "vxlan"' /tmp/flannel-verify-render.yaml
      - >-
        grep -qF 'ghcr.io/flannel-io/flannel:v0.28.9' /tmp/flannel-verify-render.yaml
      - >-
        grep -qF 'ghcr.io/flannel-io/flannel-cni-plugin:v1.9.1-flannel3' /tmp/flannel-verify-render.yaml
      - >-
        grep -qF 'livenessProbe:' /tmp/flannel-verify-render.yaml
      - >-
        grep -qF 'readinessProbe:' /tmp/flannel-verify-render.yaml
      - >-
        grep -qF 'effect: NoExecute' /tmp/flannel-verify-render.yaml

  check:cluster-upgrades:
    aliases: [nova]
    desc: Show installed-vs-latest for live Helm releases and container images (requires nova-fairwinds)
    cmds:
      - nova find --helm --show-old --format table
      - nova find --containers --show-old --format table

  mealie:lint:
    desc: Lint Mealie Helm chart
    dir: '{{.MEALIE_CHARTS_DIR}}'
    cmds:
      - helm lint . -f values.yaml

  mealie:render:
    desc: Render Mealie Helm chart locally to catch template errors before upgrade
    dir: '{{.MEALIE_CHARTS_DIR}}'
    cmds:
      - helm template mealie . -n {{.MEALIE_NS}} -f values.yaml >/tmp/mealie-render.yaml

  mealie:upgrade:
    desc: Install or upgrade Mealie in the home cluster
    dir: '{{.MEALIE_CHARTS_DIR}}'
    cmds:
      - helm upgrade --install mealie . -n {{.MEALIE_NS}} --create-namespace -f values.yaml

  monitoring:show-syncthing-storage:
    aliases: [monitoring:sync-storage]
    desc: Show Syncthing LXC root filesystem usage from node-exporter and df
    cmds:
      - >-
        curl -fsS http://192.168.1.78:9100/metrics |
        grep 'node_filesystem_.*mountpoint="/"' | head
      - ssh -o BatchMode=yes -o ConnectTimeout=8 root@192.168.1.216 'pct exec 105 -- df -hT /'

  backblaze:lint:
    desc: Lint retired backblaze-wine Helm chart for rollback/debug only
    dir: '{{.BACKBLAZE_CHARTS_DIR}}'
    cmds:
      - helm lint . -f values.yaml

  backblaze:render:
    desc: Render retired backblaze-wine Helm chart for rollback/debug only
    dir: '{{.BACKBLAZE_CHARTS_DIR}}'
    cmds:
      - helm template backblaze-wine . -n {{.BACKBLAZE_NS}} -f values.yaml >/tmp/backblaze-wine-render.yaml

  backblaze:configure-nfs-export:
    desc: Configure pve-1 /home-storage/home-cloud/home-share NFS export for the retired K8s Backblaze experiment
    prompt: This changes NFS exports on pve-1. Continue?
    cmds:
      - ANSIBLE_BECOME_ASK_PASS=false {{.ANSIBLE}} configure-backblaze-nfs-export.yaml

  backblaze:remove-retired-nfs-export:
    desc: Remove pve-1 NFS export used only by the retired K8s Backblaze experiment
    prompt: This removes an NFS export on pve-1. Continue?
    cmds:
      - ANSIBLE_BECOME_ASK_PASS=false {{.ANSIBLE}} remove-backblaze-nfs-export.yaml

  backblaze:setup-lxc:
    desc: Create pve-1 Backblaze LXC with local NAS bind mount; does not start backup client until VNC env is added
    prompt: This creates/updates LXC 106 on pve-1 and bind-mounts NAS data read-write. Continue?
    cmds:
      - ANSIBLE_BECOME_ASK_PASS=false {{.ANSIBLE}} setup-backblaze-lxc.yaml

  backblaze:install-exporter:
    desc: Install Prometheus exporter inside Backblaze LXC 106
    cmds:
      - ANSIBLE_BECOME_ASK_PASS=false {{.ANSIBLE}} install-backblaze-exporter.yaml

  backblaze:fix-ui:
    desc: Fix Backblaze noVNC blue/black screen by resetting UI cache and reopening D drive
    cmds:
      - ANSIBLE_BECOME_ASK_PASS=false {{.ANSIBLE}} fix-backblaze-ui.yaml

  backblaze:prepare-namespace:
    desc: Retired K8s experiment only - create and label Backblaze namespace
    cmds:
      - kubectl create namespace {{.BACKBLAZE_NS}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl label namespace {{.BACKBLAZE_NS}} pod-security.kubernetes.io/enforce=privileged pod-security.kubernetes.io/audit=privileged pod-security.kubernetes.io/warn=privileged --overwrite

  backblaze:upgrade:
    desc: RETIRED/ROLLBACK ONLY - redeploy failed K8s/NFS Backblaze experiment
    prompt: This redeploys the retired K8s/NFS Backblaze experiment that Backblaze detected as a network disk. Continue only for rollback/debug?
    dir: '{{.BACKBLAZE_CHARTS_DIR}}'
    cmds:
      - kubectl create namespace {{.BACKBLAZE_NS}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl label namespace {{.BACKBLAZE_NS}} pod-security.kubernetes.io/enforce=privileged pod-security.kubernetes.io/audit=privileged pod-security.kubernetes.io/warn=privileged --overwrite
      - helm upgrade --install backblaze-wine . -n {{.BACKBLAZE_NS}} --create-namespace -f values.yaml

  plane:lint:
    desc: Lint the disposable Plane CE pilot Helm chart using both the committed and local secret values files
    dir: '{{.PLANE_CHARTS_DIR}}'
    preconditions:
      - sh: test -f secret-values.yaml
        msg: charts/plane/secret-values.yaml not found - copy secret-values.example.yaml to secret-values.yaml and fill in local values first
    cmds:
      - helm lint . -f values.yaml -f secret-values.yaml

  plane:render:
    desc: Render the disposable Plane CE pilot Helm chart locally to catch template errors before upgrade
    dir: '{{.PLANE_CHARTS_DIR}}'
    preconditions:
      - sh: test -f secret-values.yaml
        msg: charts/plane/secret-values.yaml not found - copy secret-values.example.yaml to secret-values.yaml and fill in local values first
    cmds:
      - helm template plane . -n {{.PLANE_NS}} -f values.yaml -f secret-values.yaml >/tmp/plane-render.yaml

  plane:dry-run:
    desc: Server-side dry-run of the Plane CE pilot Helm upgrade against the live cluster without mutating anything
    dir: '{{.PLANE_CHARTS_DIR}}'
    preconditions:
      - sh: test -f secret-values.yaml
        msg: charts/plane/secret-values.yaml not found - copy secret-values.example.yaml to secret-values.yaml and fill in local values first
      - sh: '[ "$(kubectl config current-context)" = "home-base" ]'
        msg: current kubectl context is not home-base - refusing to dry-run against the wrong cluster
    cmds:
      - helm upgrade --install plane . -n {{.PLANE_NS}} --create-namespace -f values.yaml -f secret-values.yaml --dry-run=server

  plane:upgrade:
    desc: Install or upgrade the disposable Plane CE pilot in the home cluster - no real data
    prompt: Plane CE is a disposable home-lab pilot and must never hold real data. This installs/upgrades it in the {{.PLANE_NS}} namespace. Continue?
    dir: '{{.PLANE_CHARTS_DIR}}'
    preconditions:
      - sh: test -f secret-values.yaml
        msg: charts/plane/secret-values.yaml not found - copy secret-values.example.yaml to secret-values.yaml and fill in local values first
      - sh: '[ "$(kubectl config current-context)" = "home-base" ]'
        msg: current kubectl context is not home-base - refusing to upgrade against the wrong cluster
    cmds:
      - helm upgrade --install plane . -n {{.PLANE_NS}} --create-namespace -f values.yaml -f secret-values.yaml --atomic --timeout 35m

  family-retirement-planner:test:
    desc: Run Family Retirement Planner unit and static checks
    dir: '{{.RETIREMENT_APP_DIR}}'
    cmds:
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test ./...

  family-retirement-planner:integration:
    desc: Run PostgreSQL-backed household isolation tests; requires local Docker
    dir: '{{.RETIREMENT_APP_DIR}}'
    cmds:
      - docker compose up -d --wait postgres
      - TEST_DATABASE_URL=postgres://retirement:retirement@localhost:5432/retirement?sslmode=disable go test -tags=integration ./internal/app/...
      - docker compose down -v

  family-retirement-planner:lint-chart:
    desc: Lint Family Retirement Planner Helm chart without touching cluster
    dir: '{{.RETIREMENT_CHART_DIR}}'
    cmds:
      - helm lint . -f values.yaml -f secret-values.example.yaml

  family-retirement-planner:render-chart:
    desc: Render Family Retirement Planner Helm chart without touching cluster
    dir: '{{.RETIREMENT_CHART_DIR}}'
    cmds:
      - helm template family-retirement-planner . -n family-retirement-planner -f values.yaml -f secret-values.example.yaml >/tmp/family-retirement-planner-render.yaml

  family-retirement-planner:verify:
    desc: Run static app and chart verification; excludes Docker-backed integration tests
    cmds:
      - task: family-retirement-planner:test
      - task: family-retirement-planner:lint-chart
      - task: family-retirement-planner:render-chart
