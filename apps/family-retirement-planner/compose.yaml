services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: retirement
      POSTGRES_PASSWORD: retirement
      POSTGRES_DB: retirement
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retirement"]
      interval: 2s
      timeout: 2s
      retries: 20
