replicaCount: 1
image:
  repository: registry.theramirez.casa/family-retirement-planner
  tag: "0.1.0"
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: 8080
postgres:
  image: postgres:17-alpine
  storageClass: ssd
  storage: 10Gi
  database: retirement
  user: retirement
httpRoute:
  hostname: family-retirement-planner.theramirez.casa
  parentRefs:
    - name: home
      namespace: kgateway-system
      sectionName: https
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
