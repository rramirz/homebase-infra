{{- if or (not .Values.secrets.postgresPassword) (eq .Values.secrets.postgresPassword "replace-me") }}{{ fail "set a non-placeholder secrets.postgresPassword" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "planner.name" . }}
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  database-url: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" .Values.postgres.user .Values.secrets.postgresPassword (include "planner.name" .) .Values.postgres.database | quote }}
