apiVersion: v1
kind: Service
metadata:
  name: {{ include "planner.name" . }}-postgres
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: {{ include "planner.name" . }}-postgres}
  ports: [{name: postgres, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "planner.name" . }}-postgres
spec:
  serviceName: {{ include "planner.name" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "planner.name" . }}-postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "planner.name" . }}-postgres}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "planner.name" . }}, key: postgres-password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          readinessProbe: {exec: {command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]}, initialDelaySeconds: 5}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storageClass }}
        resources: {requests: {storage: {{ .Values.postgres.storage }}}}
