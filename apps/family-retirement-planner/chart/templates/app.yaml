apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "planner.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "planner.name" . }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "planner.name" . }}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          ports: [{name: http, containerPort: {{ .Values.service.targetPort }}}]
          env:
            - {name: ADDR, value: ":8080"}
            - {name: COOKIE_SECURE, value: "true"}
            - {name: GIN_MODE, value: "release"}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ include "planner.name" . }}, key: database-url}}
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 5}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, initialDelaySeconds: 5}
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "planner.name" . }}
spec:
  selector: {app.kubernetes.io/name: {{ include "planner.name" . }}}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "planner.name" . }}
spec:
  parentRefs: {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames: [{{ .Values.httpRoute.hostname | quote }}]
  rules:
    - backendRefs: [{name: {{ include "planner.name" . }}, port: {{ .Values.service.port }}}]
