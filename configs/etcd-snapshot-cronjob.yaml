---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshot
  namespace: kube-system
  labels:
    app.kubernetes.io/name: etcd-snapshot
spec:
  schedule: "17 */12 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          hostNetwork: true
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          initContainers:
            - name: save
              image: registry.k8s.io/etcd:3.6.5-0
              command:
                - etcdctl
                - --endpoints=https://127.0.0.1:2379
                - --cacert=/etc/kubernetes/pki/etcd/ca.crt
                - --cert=/etc/kubernetes/pki/etcd/server.crt
                - --key=/etc/kubernetes/pki/etcd/server.key
                - snapshot
                - save
                - /backup/.incoming.db
              volumeMounts:
                - { name: etcd-certs, mountPath: /etc/kubernetes/pki/etcd, readOnly: true }
                - { name: backup, mountPath: /backup }
            - name: verify
              image: registry.k8s.io/etcd:3.6.5-0
              command: [etcdutl, snapshot, status, /backup/.incoming.db, -w, table]
              volumeMounts:
                - { name: backup, mountPath: /backup }
          containers:
            - name: rotate
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  set -eu
                  ts=$(date -u +%Y%m%d-%H%M%S)
                  mv /backup/.incoming.db "/backup/etcd-snapshot-$ts.db"
                  chmod 600 "/backup/etcd-snapshot-$ts.db"
                  find /backup -name 'etcd-snapshot-*.db' -mtime +7 -delete
                  ls -l /backup
              volumeMounts:
                - { name: backup, mountPath: /backup }
          securityContext:
            runAsUser: 0
          volumes:
            - name: etcd-certs
              hostPath: { path: /etc/kubernetes/pki/etcd, type: Directory }
            - name: backup
              hostPath: { path: /var/backups/etcd, type: DirectoryOrCreate }
